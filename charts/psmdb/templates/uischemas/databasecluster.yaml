---
# Specification:
# 
# <fieldName>:
#   uiType: string  # Name of the UI component
#   params: object  # Parameters to configure the UI component
#   default: any    # default value for the field
#   validation:     # Validation rules for the field
#     required: boolean
#     regExpr: string
#     celExpr: string
#     min: integer
#     max: integer
#   subParameters:
#     <fieldName>:
#       ...
---
# Following UI components are used:
# 1. Toggle (boolean)
# 2. Number (integer)
#   2.1 params
#      - badge: string # a text badge appears on the right side of the text field 
#      - label: string # the label of the field
#      - placeholder: string # the placeholder of the field
#      - options: array of numbers to pick from
#        - label: string # the label of the option
#        - value: string # the value of the option
# 3. TextArea (string)
#   3.1 params
#      - label: string # the label of the field
# 4. StorageClassSelect (string)
#   4.1 params
#      - label: string # the label of the field
# 5. Input (string)
#   5.1 params
#      - label: string # the label of the field
# 6. SecretSelector (string)
#   6.1 params
#      - label: string # the label of the field
#      - namespaceSelector: object # option for listing namespaces
# 7. Switch (boolean)
#   7.1 params
#      - label: string # the label of the field
#      - options: array of objects
#        - label: string # the label of the option
#        - value: string # the value of the option
# 8. Group (object)
#   8.1 params
#      - label: string # the label of the field
---
global:
  allowUnsafeFlags:
    uiType: Toggle
    label: Unsafe Flags
    description: Allow unsafe flags to be set

components:
  mongod:
    replicas:
      uiType: Number
      description: Number of replica nodes
      params:
        label: Replicas
        placeholder: ''
    storage:
      uiType: Group
      description: Storage configuration for the Mongod component
      params:
        label: Storage
      subParameters:
        class:
          uiType: StorageClassSelect # UI will call an API to list storage classes
          description: Storage class for the Mongod component
          params:
            label: Storage Class
        size:
          uiType: Number
          description: Size of the storage
          params:
            label: Size
            badge: Gi
            options:
            - label: 10Gi
              value: 10Gi
            - label: 20Gi
              value: 20Gi
            - label: 30Gi
              value: 30Gi
    resources:
      uiType: Group
      label: Resource Requests & Limits
      description: Resource requests and limits for the Mongod component
      subParameters:
        requests:
          uiType: Group
          label: Requests
          subParameters:
            cpu:
              uiType: Number
              params:
                badge: Cores
                label: CPU
              description: CPU Requests
            memory:
              uiType: Number
              params:
                badge: Gi
                label: Memory
              description: Memory Requests
        limits:
          uiType: Group
          label: Limits
          subParameters:
            cpu:
              uiType: Number
              params:
                badge: Cores
                label: CPU
              description: CPU Limits
            memory:
              uiType: Number
              params:
                badge: Gi
                label: Memory
              description: Memory Limits
    config:
      uiType: TextArea
      description: Configuration for MongoDB
      params:
        label: MongoDB Configuration
    service:
      uiType: Group
      params:
        label: Service settings
      description: Configuration for Mongod service
      subParameters:
        expose:
          uiType: Switch
          params:
            label: Expose service
            options:
            - label: ClusterIP
              value: ClusterIP
            - label: NodePort
              value: NodePort
            - label: LoadBalancer
              value: LoadBalancer
          description: Expose the Mongod service
  backup:
    replicas:
      uiType: Hidden
    service:
      uiType: Hidden
    storage:
      uiType: Hidden
    resources:
      uiType: Group
      params:
        label: Resource Requests & Limits
      description: Resource requests and limits for the Mongod component
      subParameters:
        requests:
          uiType: Group
          label: Requests
          subParameters:
            cpu:
              uiType: Number
              params:
                badge: Cores
                label: CPU
              description: CPU Requests
            memory:
              uiType: Number
              params:
                badge: Gi
                label: Memory
              description: Memory Requests
        limits:
          uiType: Group
          label: Limits
          subParameters:
            cpu:
              uiType: Number
              params:
                badge: Cores
                label: CPU
              description: CPU Limits
            memory:
              uiType: Number
              params:
                badge: Gi
                label: Memory
              description: Memory Limits

  pmm:
    replicas:
      uiType: Hidden
    service:
      uiType: Hidden
    storage:
      uiType: Hidden
    resources:
      uiType: Group
      params:
        label: Resource Requests & Limits
      description: Resource requests and limits for the Mongod component
      subParameters:
        requests:
          uiType: Group
          label: Requests
          subParameters:
            cpu:
              uiType: Number
              params:
                badge: Cores
                label: CPU
              description: CPU Requests
            memory:
              uiType: Number
              params:
                badge: Gi
                label: Memory
              description: Memory Requests
        limits:
          uiType: Group
          label: Limits
          subParameters:
            cpu:
              uiType: Number
              params:
                badge: Cores
                label: CPU
              description: CPU Limits
            memory:
              uiType: Number
              params:
                badge: Gi
                label: Memory
              description: Memory Limits
    serverHost:
      uiType: Input
      params:
        label: PMM Server Host
      description: PMM Server Host
    credentialSecretName:
      uiType: SecretSelector
      params:
        label: PMM Credential Secret Name
      description: PMM Credential Secret Name

topologySchema:
  standard: {}
  sharded:
    shards:
      uiType: Number
      params:
        label: Shards Per Node
      description: Number of shards per node
      validation:
        min: 1
        max: 99
     